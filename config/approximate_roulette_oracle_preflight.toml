schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_approximate_roulette"
family = "stochastic_pruning"
oracle = "independent_seeded_word_action_and_exhaustive_expectation"
output_contract = "owned_approximate_trajectory_and_errors"

[grid]
dimension = [2]
signature = ["indefinite"]
regime = ["contracting"]
recurrence = ["affine"]
horizon = [2]
strategy = ["roulette"]
survival_probability = ["1/16", "1/8", "1/4", "1/2", "3/4", "7/8", "1/1"]
draw_seed = [20260928, 20260929, 20260930, 20261001, 20261002]

[limits]
max_cases = 35
case_seconds = 120
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
