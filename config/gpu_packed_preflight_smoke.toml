schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "preflight_only_other_desktop_processes_possible"
backend = "perfchecker"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "gpu_packed_exact"

[grid]
dimension = [8, 65]
family = ["higher_rank"]
signature = ["mixed"]
horizon = [1, 32]
strategy = ["cpu_packed", "gpu_host_owned"]

[limits]
max_cases = 8
samples = 3
sample_seconds = 0.2
case_seconds = 120
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
