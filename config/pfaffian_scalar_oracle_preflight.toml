schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_pfaffian_scalar"
family = "ordered_even_vector_chain_scalar"
oracle = "independent_Rational_BigInt_Chevalley_exterior_action"
output_contract = "owned_scalar_projection_vector"

[grid]
dimension = [3]
chain_length = [4]
strategy = ["pfaffian", "precontracted", "full", "recursive"]
horizon = [1]

[limits]
max_cases = 4
case_seconds = 60
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
