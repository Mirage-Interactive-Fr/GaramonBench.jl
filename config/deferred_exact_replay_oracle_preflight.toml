schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_deferred_exact_replay"
family = "deferred_exact_reconstruction"
oracle = "independent_rational_ambient_basis_words"
output_contract = "owned_exact_rational_deferred_and_replay_final_vectors"

[grid]
dimension = [2]
signature = ["positive"]
regime = ["contracting"]
recurrence = ["bilinear"]
horizon = [2]
strategy = ["deferred_and_replay"]

[limits]
max_cases = 1
case_seconds = 120
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
