schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_cpu_processes"
family = "sparse8"
oracle = "independent_Int64_Euclidean_Clifford_word"
output_contract = "owned_all_packed_coefficients_and_worker_identity"
workers = 1

[grid]
dimension = [4]
strategy = ["resident_process"]
batch = [4]

[limits]
max_cases = 1
case_seconds = 120
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
