schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260930

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_modular_crt"
family = "integer_diagonal_geometric_product"
oracle = "independent_signed_blade_pair_BigInt_sum"
output_contract = "owned_sequence_of_all_exact_coefficients"

[grid]
dimension = [2, 3, 4, 5, 6, 8, 16, 32, 65, 129]
signature = ["positive", "mixed", "degenerate"]
mode = ["prepared", "oneshot", "direct_bigint"]
coefficient_bits = [8, 64, 128]
prime_bits = [17, 31]
max_primes = [1, 4, 8, 16]
horizon = [1, 64, 1024]

[[case_constraints]]
when = {mode = "direct_bigint"}
require = {prime_bits = 17, max_primes = 1}

[limits]
max_cases = 4590
case_seconds = 600
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
