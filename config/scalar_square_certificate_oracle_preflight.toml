schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_scalar_square_certificate"
family = "scalar_square_short_identity"
oracle = "independent_antisymmetrized_Chevalley_action"
output_contract = "owned_exact_rational_power_and_certificate_counts"

[grid]
dimension = [3]
exponent = [3]
horizon = [1]
metric_family = ["general"]
shape = ["simple_bivector"]
changes = ["stable"]
strategy = ["certify_each"]

[limits]
max_cases = 1
case_seconds = 120
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
