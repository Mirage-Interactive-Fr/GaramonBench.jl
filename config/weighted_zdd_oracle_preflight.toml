schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_weighted_zdd"
family = "coefficient_zero_suppressed_decision_diagram"
oracle = "independent_rational_Clifford_words"
output_contract = "owned_exact_complete_rational_product"

[grid]
dimension = [4]
signature = ["signed_degenerate"]
strategy = ["weighted_zdd_product"]

[limits]
max_cases = 1
case_seconds = 120
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
