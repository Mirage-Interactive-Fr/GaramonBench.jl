schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_verified_superopt"
family = "split_clifford_exact_full_aggregate"
oracle = "independent_bigint_clifford_word_pairs"
output_contract = "owned_full_bigint_coefficient_aggregate"
kernel = "verified"

[grid]
dimension = [2, 4, 6, 8, 10]
support_count = [4, 16, 64]
left_pattern = ["fixed", "pool4"]
preparation = ["prebuilt", "rebuild"]
horizon = [1, 16, 128]
mul_weight = [1, 10, 100]
add_weight = [1, 10]

[limits]
max_cases = 1080
case_seconds = 120
controller_rss_bytes = 6442450944
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
