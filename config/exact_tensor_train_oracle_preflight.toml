schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_exact_tensor_train"
family = "exact_tensor_train"
oracle = "independent_full_Clifford_word_pair_enumeration"
output_contract = "owned_all_ordered_blade_coefficients"

[grid]
dimension = [4]
strategy = ["bounded_exact_separable_product"]

[limits]
max_cases = 1
case_seconds = 60
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
