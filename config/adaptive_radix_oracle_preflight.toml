schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260930

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_adaptive_radix"
family = "adaptive_radix_sparse_wedge"
oracle = "independent_Int64_disjoint_mask_inversions"
output_contract = "owned_exact_sparse_wedge_sequence"

[grid]
dimension = [2, 3, 4, 5, 6, 8, 12, 16, 32, 64, 65, 96, 128, 129]
signature = ["positive", "mixed", "degenerate"]
support_shape = ["clustered", "spread"]
mutation = ["stable", "changing"]
index_policy = ["prebuilt", "rebuild"]
horizon = [1, 32, 256]

[limits]
max_cases = 1008
samples = 11
case_seconds = 600
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 536870912
