schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260930

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_cross_gram"
family = "exact_decomposable_blade_scalar_pairing"
oracle = "independent_permutation_determinant_BigInt"
output_contract = "owned_sequence_of_exact_scalar_pairings"

[grid]
dimension = [3, 4, 5, 6, 8, 16, 32, 64, 65, 129]
mode = ["prepared", "direct"]
signature = ["positive", "mixed", "degenerate"]
grade = [2, 3]
rank_regime = ["generic", "dependent"]
vector_support = [1, 2]
mutation = ["stable", "vector_change", "metric_change"]
horizon = [1, 32, 256]

[limits]
max_cases = 4320
case_seconds = 600
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
