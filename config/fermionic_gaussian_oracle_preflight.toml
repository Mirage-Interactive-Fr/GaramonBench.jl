schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260930

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_fermionic_gaussian"
family = "exact_number_conserving_fermionic_gaussian_overlap"
oracle = "independent_Leibniz_overlap_determinant_BigInt"
output_contract = "owned_sequence_of_exact_Slater_overlaps"

[grid]
dimension = [3, 4, 5, 6, 8, 16, 32, 64, 65, 129]
mode = ["factored", "materialized"]
particles = [2, 3]
shear_count = [1, 4, 16]
orbital_support = [1, 2]
target_relation = ["same", "shifted"]
horizon = [1, 32, 256]

[limits]
max_cases = 1440
case_seconds = 600
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
