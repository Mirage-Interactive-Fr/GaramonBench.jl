schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_wavefront"
family = "exact_diagonal_sparse_product_chain_target"
oracle = "independent_int64_clifford_word_inversions"
output_contract = "owned_exact_target_coefficients"

[grid]
dimension = [2, 3, 4, 5, 6, 8, 12, 16, 32, 64, 65, 96, 128, 129]
signature = ["positive", "mixed", "degenerate"]
support_shape = ["clustered", "spread"]
active_directions = ["narrow", "wide"]
mutation = ["stable", "changing"]
preparation = ["prebuilt", "rebuild"]
chain_length = [3, 4]
horizon = [1, 32, 256]
target_kind = ["reachable", "absent"]

[limits]
max_cases = 8064
case_seconds = 120
controller_rss_bytes = 5368709120
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
