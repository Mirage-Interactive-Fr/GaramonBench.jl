schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_factorized_versor"
family = "factorized_blade_versor"
oracle = "independent_rational_reflections_and_minors"
output_contract = "owned_all_grade_two_coefficients"

[grid]
dimension = [4]
strategy = ["two_reflections"]

[limits]
max_cases = 1
case_seconds = 60
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
