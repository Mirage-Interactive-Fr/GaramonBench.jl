backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_generated_product"
family = "bounded_generated_product"
oracle = "independent_int64_explicit_vector_basis_inversions"
