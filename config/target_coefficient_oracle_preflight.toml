schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_target_coefficient"
family = "selected_binary_product"
oracle = "independent_Int64_word_inversions_and_grade_selection"
output_contract = "owned_selected_coefficient_matrix"

[grid]
dimension = [2, 3, 4, 5, 6, 7, 8, 16, 32, 64, 65, 96, 128, 129]
signature = ["positive", "mixed", "degenerate"]
operation = ["geometric", "wedge", "left", "right", "inner", "dot", "scalar"]
strategy = ["full", "targeted"]
horizon = [1, 32]

[limits]
max_cases = 1176
case_seconds = 120
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
