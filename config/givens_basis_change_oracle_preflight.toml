schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260930

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_givens"
family = "exact_euclidean_outermorphism"
oracle = "independent_materialized_matrix_or_factored_transform"
output_contract = "owned_sequence_of_exact_rational_blade_coefficients"

[grid]
dimension = [2, 3, 4, 5, 6, 8, 16, 32, 65, 129]
mode = ["factored", "materialized"]
rotation_count = [1, 2, 4, 8]
support = [1, 4, 16]
grade = [1, 2]
angle = ["3-4-5", "5-12-13"]
horizon = [1, 64, 1024]

[limits]
max_cases = 2880
case_seconds = 600
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
