schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_cpu_threaded_packed"
family = "cpu_packed_columns"
oracle = "independent_int64_explicit_vector_basis_inversions"
output_contract = "owned_float64_structural_coefficient_matrix"
threads_required = 4

[grid]
dimension = [8]
signature = ["mixed"]
strategy = ["serial_resident", "threaded_resident"]
horizon = [1, 32]

[limits]
max_cases = 4
case_seconds = 120
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
