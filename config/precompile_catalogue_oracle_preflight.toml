schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_precompile_catalogue"
family = "precompilation_catalogue"
oracle = "independent_Int64_Clifford_word_inversions"
output_contract = "owned_all_EGA3_generated_product_coefficients"

[grid]
dimension = [3]
scenario = ["known"]
strategy = ["generated"]

[limits]
max_cases = 1
case_seconds = 180
controller_rss_bytes = 4294967296
build_disk_bytes = 1073741824
source_snapshot_bytes = 67108864
archive_bytes = 268435456
