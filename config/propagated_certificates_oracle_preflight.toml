schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only_other_desktop_processes_possible"
backend = "oracle_preflight"
seed = 20260930

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_propagated_certificates"
family = "exact_three_input_geometric_chain"
oracle = "independent_signed_triple_blade_BigInt_sum"
output_contract = "owned_sequence_of_all_exact_three_input_coefficients"

[grid]
dimension = [2, 3, 4, 5, 6, 8, 16, 32, 65, 129]
mode = ["certified", "direct"]
regime = ["stable", "cancellation", "support_change", "metric_change"]
signature = ["positive", "mixed", "degenerate"]
support = [2, 3]
horizon = [1, 32, 256]

[limits]
max_cases = 1440
case_seconds = 600
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
