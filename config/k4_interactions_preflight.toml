schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only"
backend = "oracle_preflight"
seed = 20260929

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_k4_interactions"
family = "exact_euclidean_bivector_transform"
signature = "positive"
output_contract = "owned_exact_grade_two_coefficients"

[grid]
dimension = [3, 5, 8]
horizon = [1, 32]
seed = [20260928, 20260929]
scenario = ["reference", "D", "W", "R", "G", "DW", "DR", "DG", "WR", "WG", "RG", "DWR", "DWG", "DRG", "WRG", "DWRG"]

[limits]
max_cases = 192
samples = 21
case_seconds = 300
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
