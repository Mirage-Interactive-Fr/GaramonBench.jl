schema_version = 1

[campaign]
condition = "exploratory_interference"
interference_label = "correctness_only"
backend = "oracle_preflight"
seed = 20260928

[repositories]
julia = {env = "GARAMON_JULIA_ROOT", default = "~/.julia/dev/Garamon"}

[case_defaults]
adapter = "garamon_k3_shared_workspace"
family = "shared_scalar_chains"
oracle = "independent_rational_Chevalley_scalar"
output_contract = "owned_exact_scalar_chain_matrix"

[grid]
dimension = [3]
strategy = ["shared_cached"]
horizon = [3]

[limits]
max_cases = 1
case_seconds = 120
controller_rss_bytes = 4294967296
build_disk_bytes = 268435456
source_snapshot_bytes = 67108864
archive_bytes = 268435456
